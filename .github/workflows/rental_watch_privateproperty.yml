name: PrivateProperty Rental Watch - Stellenbosch

on:
  schedule:
    - cron: "0 * * * *"  # hourly, same cadence as the Property24 bot
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright beautifulsoup4 requests
          playwright install --with-deps chromium

      - name: Run scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python privateproperty_scraper.py

      - name: Commit updated seen file
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add seen_privateproperty.json
          git diff --staged --quiet || git commit -m "Update seen listings"
          git push
