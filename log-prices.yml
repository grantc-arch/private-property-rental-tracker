name: Log prices

on:
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC = 07:00 SAST, daily
  workflow_dispatch:        # lets you run it manually from the Actions tab

permissions:
  contents: write

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python log_prices.py
      - name: Commit updated price log
        run: |
          git config user.name "price-logger"
          git config user.email "price-logger@users.noreply.github.com"
          git add data/prices.csv
          git diff --staged --quiet || git commit -m "Price log $(date -u +%F)"
          git push
